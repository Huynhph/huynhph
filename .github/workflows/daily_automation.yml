name: Daily Marketing Automation

on:
  schedule:
    # Runs at 01:00 UTC Monday & Thursday (08:00 AM Ho Chi Minh City time)
    - cron: '0 1 * * 1,4'
  workflow_dispatch: # Manual trigger

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install chromium

    - name: Run Automation Pipeline
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
      run: |
        python3 meta_bridge.py
        python3 brand_analyzer.py
        python3 optimizer.py

    - name: Archive Optimization Reports and Prompts
      uses: actions/upload-artifact@v4
      with:
        name: HoaMai_Action_Plans
        path: action_plans/
        retention-days: 7